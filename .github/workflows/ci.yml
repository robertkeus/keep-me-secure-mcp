name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose build test mcp
      - run: docker compose run --rm test
