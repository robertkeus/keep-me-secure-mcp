name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run build:plugin && git diff --exit-code plugin/server.mjs
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - run: docker compose build test mcp
      - run: docker compose run --rm test
