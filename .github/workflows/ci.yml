name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run build:plugin && git diff --exit-code plugin/server.mjs
      - run: npm run build:site && git diff --exit-code site/incidents.json site/incidents.html site/runtimes.json site/changelog.html
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - run: docker compose build test mcp
      - run: docker compose run --rm test
